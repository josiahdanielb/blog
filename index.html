---
layout: home
title: Home
---

<section class="intro">
  <h1>Daniel Josiah's Blog</h1>

  <p>
    A repository of logs pertaining to my better understanding of Software Engineering
  </p>
</section>

<section class="blog-posts">
  <h2>Logs</h2>

  {% for posts in site.posts %}
    <article class="post-preview">

      <h3>
        <a href="{{ post.url | relative_url }}">
          {{ post.title }}
        </a>
      </h3>
        <p>
          {{ post.date | date: "%B %d, %Y" }}
        </p>

        <p>
          {{ post.excerpt }}
        </p>

        <a href="{{ post.url | relative_url }}">
          Read More →
        </a>
      
    </article>

  {% endfor %}
  
</section>
